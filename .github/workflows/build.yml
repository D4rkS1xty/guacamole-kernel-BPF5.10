name: Build guacamole kernel (ArrowOS + 5.10 BPF)

# Builds the OnePlus 7 Pro (guacamole / sm8150) kernel from
#   https://github.com/ArrowOS-Devices/android_kernel_oneplus_sm8150  (arrow-12.1, 4.14.274)
# with the full 5.10 BPF backport cherry-picked from
#   https://github.com/PhoenixKernel/linux  (android-4.14-phoenix)
# (the exact range from 4.14_5.10bpf_commits.txt: cc47ca5^..7b03162)
#
# Adds BPF_LSM / CONFIG_LSM (BPF_PRELOAD stays off -- see apply-defconfig.sh)
# and makes SELinux permissive by default (the target ColorOS15 boot.img
# already carries androidboot.selinux=permissive as well).
#
# No root manager is added on purpose: no KernelSU, no SUSFS, no Magisk.
#
# The primary artifact is the raw arch/arm64/boot/Image.gz, which
# tools/repack_bootimg.py drops straight into the target boot.img (keeping the
# ROM's ramdisk and device-tree blob untouched).

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "arm64 defconfig to build"
        required: false
        default: "stock_defconfig"
      skip_bpf:
        description: "Set to 1 to skip the BPF backport (debug)"
        required: false
        default: "0"
  push:
    branches: [ main, master ]
    paths-ignore:
      - "**.md"
      - "legacy/**"
      - "tools/**"

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/ArrowOS-Devices/android_kernel_oneplus_sm8150
  KERNEL_BRANCH: arrow-12.1
  BPF_REPO: https://github.com/PhoenixKernel/linux
  BPF_BRANCH: android-4.14-phoenix
  # Exact range from 4.14_5.10bpf_commits.txt
  BPF_START: cc47ca5651d869c037f90cb5276d60f240c00719
  BPF_END: 7b031620e7605c2cae5597bdc53f306e030ffd4a
  # shallow depth used when fetching the backport branch (range is 1024 commits)
  BPF_DEPTH: "1300"
  ARTIFACT: guacamole-arrow12.1-bpf5.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/az /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Cache clang toolchain
        uses: actions/cache@v4
        with:
          path: tc/clang
          key: clang-r547379-v1

      - name: Install toolchain + dependencies
        run: bash scripts/setup-toolchain.sh

      - name: Clone kernel source (${{ env.KERNEL_BRANCH }})
        run: git clone --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Backport 5.10 BPF from PhoenixKernel
        if: ${{ github.event.inputs.skip_bpf != '1' }}
        run: bash scripts/backport-bpf.sh

      - name: Apply backport helper fixups
        if: ${{ github.event.inputs.skip_bpf != '1' }}
        run: bash scripts/fixups.sh

      - name: Apply defconfig changes (BPF_LSM/BPF_PRELOAD/CONFIG_LSM/permissive)
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'stock_defconfig' }}
        run: bash scripts/apply-defconfig.sh

      - name: Compile kernel (Image.gz)
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig || 'stock_defconfig' }}
        run: bash scripts/build.sh

      - name: Collect artifacts (Image.gz + AnyKernel3 zip)
        run: bash scripts/package.sh

      - name: Upload kernel Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-Image.gz
          path: |
            dist/Image.gz
            dist/kernel-rev.txt
            dist/System.map
            dist/.config
          if-no-files-found: error
          retention-days: 30

      - name: Upload flashable AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-anykernel3
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Publish latest kernel to a Release (stable download URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-latest
          name: guacamole ArrowOS 4.14 + 5.10 BPF backport (latest)
          body: |
            Built from `${{ env.KERNEL_REPO }}` @ `${{ env.KERNEL_BRANCH }}`
            with the 5.10 BPF backport (`${{ env.BPF_START }}^..${{ env.BPF_END }}`).

            * `Image.gz` — raw kernel, drop into the ColorOS15 boot.img with
              `tools/repack_bootimg.py`
            * `guacamole-*.zip` — AnyKernel3 flashable zip
            * `System.map`, `.config`, `kernel-rev.txt` — reference

            No root manager. SELinux permissive by default.
          prerelease: true
          files: |
            dist/Image.gz
            dist/System.map
            dist/kernel-rev.txt
            dist/*.zip
          fail_on_unmatched_files: false
